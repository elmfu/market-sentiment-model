name = "omnibook-ai-proxy"
main = "gemini-proxy.js"
compatibility_date = "2024-09-02"
compatibility_flags = ["nodejs_compat"]

# KV namespace for caching product JSON + rate-limit state.
# Create it: wrangler kv namespace create CACHE
# Then replace the id below.
[[kv_namespaces]]
binding = "CACHE"
id      = "REPLACE_WITH_YOUR_KV_ID"

# Secrets (set via CLI, never hard-code):
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put API_TOKEN
