name = "gemini-proxy"
main = "gemini-proxy.js"
compatibility_date = "2024-09-02"
compatibility_flags = ["nodejs_compat"]

# KV namespace for caching product JSON + rate-limit state.
[[kv_namespaces]]
binding = "CACHE"
id      = "1dd0d3b0b4da4bd7b876c02cba00d935"

# Secrets (set in Cloudflare dashboard or wrangler secret put, never hard-code):
#   OPENAI_API_KEY — OpenAI key (project-scoped, budget-capped)
#   API_TOKEN      — team access token for the chat widget
